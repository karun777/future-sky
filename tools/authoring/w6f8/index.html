<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future Sky — Stay in the world</title><link rel="stylesheet" href="window.css?v=2"><script src="content.js?v=2" defer></script><script src="window.js?v=2" defer></script></head>
<body>
<main id="game">
<header class="topbar"><span class="brand">✧ FUTURE SKY</span><span class="rehearsal">W6-F8 · REHEARSAL · NOT YOUR LIVE CHARACTER</span><div><button id="fullscreen" title="Toggle fullscreen">⛶ Fullscreen</button><button id="reset">Restart</button></div></header>
<section class="world" aria-label="Current scene">
<img id="scene" alt="The interior of the pod"><div class="vignette"></div>
<div class="location"><span class="eyebrow">TRITON CENTRAL / NEPTUNE LOUNGE</span><h1 id="location-name">Wakefulness Module</h1></div>
<div class="instrument" id="implant"><span class="dot"></span> SENSORY LINK <span class="reading">LOCAL / STABLE</span></div>
<button id="room-return" class="room-return" hidden>↶ Return to room view</button>
<div class="scene-foot"><span id="image-label">POD 01</span><span id="ambient">Beyond the wall. A low thump.</span></div>
</section>
<section class="present" aria-label="Present moment">
<div class="present-top"><span class="eyebrow" id="mode">TAKE IN YOUR SURROUNDINGS</span><button data-panel="history" class="quiet">Earlier messages ↗</button></div>
<div class="passage-scroll"><h2 id="detail-title">The cubicle</h2><div id="prose"></div></div>
<div class="response"><span class="response-label">YOUR RESPONSE</span><nav id="targets" aria-label="Available responses"></nav></div>
<p id="feedback" role="status"></p>
</section>
<nav class="dock" aria-label="Game controls">
<button data-panel="movement"><span aria-hidden="true">↔</span>Move</button>
<button data-panel="actions"><span aria-hidden="true">⌖</span>Actions</button>
<button data-panel="inventory"><span aria-hidden="true">▣</span>Inventory</button>
<button data-panel="character"><span aria-hidden="true">♙</span>Character</button>
<button data-panel="journal"><span aria-hidden="true">≡</span>Journal</button>
<button data-panel="map"><span aria-hidden="true">◇</span>Map</button>
<button data-panel="hud"><span aria-hidden="true">⌁</span>HUD</button>
<button data-panel="voice"><span aria-hidden="true">◌</span>Inner voice</button>
<button data-panel="studio" class="studio"><span aria-hidden="true">✧</span>Try a mode</button>
</nav>
</main>
<dialog id="overlay" aria-labelledby="overlay-title"><div class="modal-frame"><header class="modal-header"><div><span id="overlay-kicker" class="eyebrow">FUTURE SKY</span><h2 id="overlay-title"></h2></div><button id="close-overlay" aria-label="Close and return to the scene">Return × <kbd>Esc</kbd></button></header><div id="overlay-body"></div><footer class="modal-footer" id="overlay-footer">Rehearsal only · your live character is unaffected</footer></div></dialog>
</body></html>
