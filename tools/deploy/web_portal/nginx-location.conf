# Prepared fragment, NOT installed. Insert only into future-sky.net HTTPS server.
# /play routes remain intact when passed upstream.
location = /play { return 302 /play/; }
location /play/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host future-sky.net;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_buffering off;
    # Do not log OAuth callback authorization codes in query strings.
    access_log off;
}
